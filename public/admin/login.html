<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Registration Form</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .login-card { max-width: 420px; width: 100%; padding: 40px 36px; }
    .login-logo { text-align: center; margin-bottom: 32px; }
    .login-logo .icon { font-size: 40px; margin-bottom: 10px; }
    .login-logo h1 { font-size: 26px; }
    .login-logo p { color: var(--text-muted); font-size: 14px; margin-top: 6px; }
    .form-group { margin-bottom: 18px; }
    .login-btn { width: 100%; margin-top: 8px; }
    .password-wrap { position: relative; }
    .password-wrap .toggle-pw {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text-muted); cursor: pointer;
      padding: 4px; display: flex; align-items: center;
    }
    .password-wrap .toggle-pw:hover { color: var(--text-primary); }
    .back-link { display: block; text-align: center; margin-top: 20px; color: var(--text-muted); font-size: 13px; text-decoration: none; }
    .back-link:hover { color: var(--accent-blue); }
  </style>
</head>
<body>
  <div class="glass-card login-card">
    <div class="login-logo">
      <div class="icon">🔐</div>
      <h1>Admin <span class="gradient-text">Login</span></h1>
      <p>Sign in to manage registrations</p>
    </div>

    <div class="alert alert-error" id="loginAlert" role="alert">
      <span>⚠️</span>
      <span id="loginAlertMsg">Invalid credentials.</span>
    </div>

    <div class="form-group">
      <label class="form-label" for="username">Username <span class="req">*</span></label>
      <input type="text" id="username" class="form-control" placeholder="admin" autocomplete="username">
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password <span class="req">*</span></label>
      <div class="password-wrap">
        <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password"
               onkeydown="if(event.key==='Enter') doLogin()">
        <button class="toggle-pw" type="button" onclick="togglePw()" aria-label="Toggle password visibility">
          <svg id="eyeIcon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <button class="btn btn-primary login-btn" id="loginBtn" onclick="doLogin()">
      <span class="btn-text">Sign In</span>
      <span class="btn-spinner" style="display:none"><span class="spinner"></span></span>
    </button>

    <a href="/" class="back-link">← Back to Registration Form</a>
  </div>

  <script>
    // Redirect if already logged in
    if (localStorage.getItem('adminToken')) {
      window.location.href = '/admin/dashboard.html';
    }

    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const alert = document.getElementById('loginAlert');

      if (!username || !password) {
        showAlert('Please enter both username and password.');
        return;
      }

      btn.disabled = true;
      document.querySelector('.btn-text').style.opacity = '0';
      document.querySelector('.btn-spinner').style.display = 'inline-block';
      alert.classList.remove('visible');

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('adminToken', data.token);
          localStorage.setItem('adminUser', data.username);
          window.location.href = '/admin/dashboard.html';
        } else {
          showAlert(data.error || 'Invalid credentials.');
        }
      } catch (err) {
        showAlert('Network error. Please try again.');
      } finally {
        btn.disabled = false;
        document.querySelector('.btn-text').style.opacity = '1';
        document.querySelector('.btn-spinner').style.display = 'none';
      }
    }

    function showAlert(msg) {
      document.getElementById('loginAlertMsg').textContent = msg;
      document.getElementById('loginAlert').classList.add('visible');
    }

    function togglePw() {
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
